<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="application-name" content="航班助手" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="航班助手" />
    <title>航班助手</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./vendor/flatpickr/flatpickr.min.css?v=4.6.13" />
    <link rel="stylesheet" href="./styles.css?v=26" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">FLIGHT WATCH</p>
          <h1>航班助手</h1>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="設定同步金鑰">
          <span aria-hidden="true">⋮</span>
        </button>
      </header>

      <section class="status-strip" id="statusStrip">
        <span class="status-dot"></span>
        <span id="statusText">準備搜尋</span>
      </section>

      <nav class="tabs" aria-label="搜尋類型" role="tablist">
        <button class="tab active" data-panel="flightPanel" aria-controls="flightPanel" aria-selected="true" role="tab" type="button">航班搜尋</button>
        <button class="tab" data-panel="savedPanel" aria-controls="savedPanel" aria-selected="false" role="tab" type="button">航班追蹤</button>
      </nav>

      <section class="panel active" id="flightPanel" role="tabpanel">
        <form class="search-form" id="flightForm">
          <fieldset class="filter-fieldset">
            <legend>旅程</legend>
            <div class="segmented-filter journey-filter">
              <label><input type="radio" name="journeyType" value="simple" checked /><span>來回</span></label>
              <label><input type="radio" name="journeyType" value="oneway" /><span>單程</span></label>
              <label><input type="radio" name="journeyType" value="multicity" /><span>多城市停留</span></label>
            </div>
          </fieldset>
          <nav id="tripSummary" class="trip-summary" aria-label="目前行程"></nav>
          <label id="ticketModeField" hidden>
            <span>多城市購票方式</span>
            <select name="ticketMode" disabled>
              <option value="through" selected>聯程整趟報價（預設）</option>
              <option value="separate">分開購票加總</option>
            </select>
          </label>
          <label>
            <span>日期條件</span>
            <select name="dateConstraint">
              <option value="flexible">彈性日期</option>
              <option value="departure">固定出發日</option>
              <option value="return">固定回程日</option>
              <option value="both">固定去回日期</option>
            </select>
          </label>
          <div class="field-row" id="fixedFlightFields" hidden>
            <label id="fixedDepartureField" hidden><span>出發起飛日（當地）</span><input name="fixedDepartureDate" type="date" disabled /></label>
            <label id="fixedReturnField" hidden><span>回程起飛日（當地）</span><input name="fixedReturnDate" type="date" disabled /></label>
          </div>
          <div class="mode-switch" id="flexibleModeSwitch" aria-label="機票搜尋模式">
            <button class="mode-button active" data-flight-mode="annual_low" type="button">全年低價探索</button>
            <button class="mode-button" data-flight-mode="date_window" type="button">日期區間</button>
          </div>
          <div class="field-row">
            <label>
              <span>出發地</span>
              <div class="place-combobox">
                <input name="departureId" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入兩字即可" required data-place-input="departure" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="departurePlaceOptions" />
                <div class="place-options" id="departurePlaceOptions" role="listbox" hidden></div>
              </div>
            </label>
            <label>
              <span>目的地</span>
              <div class="place-combobox">
                <input name="arrivalId" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入兩字即可" required data-place-input="arrival" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="arrivalPlaceOptions" />
                <div class="place-options" id="arrivalPlaceOptions" role="listbox" hidden></div>
              </div>
            </label>
          </div>
          <fieldset id="stopoverFields" class="stopover-fields" hidden disabled>
            <legend>途中停留 B 地</legend>
            <label>
              <span>停留機場</span>
              <div class="place-combobox">
                <input name="stopoverId" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入兩字即可" required data-place-input="stopover" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="stopoverPlaceOptions" />
                <div class="place-options" id="stopoverPlaceOptions" role="listbox" hidden></div>
              </div>
            </label>
            <div class="field-row">
              <label><span>B 地最少住幾晚</span><input name="stopoverMinNights" type="number" min="1" max="30" value="2" required /></label>
              <label><span>B 地最多住幾晚</span><input name="stopoverMaxNights" type="number" min="1" max="30" value="5" required /></label>
            </div>
            <label class="check-option"><input type="checkbox" name="includeReturn" /><span>從目的地 C 返回出發地 A</span></label>
            <fieldset id="destinationStayFields" hidden disabled>
              <legend>目的地 C 地停留</legend>
              <div class="field-row">
                <label><span>C 地最少住幾晚</span><input name="destinationMinNights" type="number" min="1" max="30" value="3" required /></label>
                <label><span>C 地最多住幾晚</span><input name="destinationMaxNights" type="number" min="1" max="30" value="7" required /></label>
              </div>
            </fieldset>
          </fieldset>
          <label id="tripDaysField"><span>旅行天數</span><input name="tripDays" type="number" inputmode="numeric" min="1" max="60" value="5" /></label>
          <details class="leg-schedules">
            <summary>各段出發／抵達日期與時段（當地時間）</summary>
            <div id="legScheduleFields"></div>
            <datalist id="airlineSuggestions"></datalist>
          </details>
          <div class="window-only" id="windowFlightFields" hidden>
            <div class="field-row">
              <label><span>最早出發日</span><input name="startDate" type="date" /></label>
              <label><span>往後搜尋</span><select name="lookaheadDays"><option value="0">僅當天</option><option value="7">7 天</option><option value="14">14 天</option><option value="30" selected>30 天</option><option value="60">60 天</option><option value="90">90 天</option></select></label>
            </div>
          </div>
          <details class="secondary-options">
            <summary>其他搜尋條件</summary>
            <div class="secondary-options-body">
              <label><span>追蹤目標價（選填）</span><input name="targetPrice" inputmode="numeric" placeholder="8000" /></label>
              <label><span>全程指定航空公司（選填）</span><input name="journeyAirline" list="airlineSuggestions" placeholder="不限航空／MU 中國東方航空" maxlength="80" /></label>
          <fieldset class="filter-fieldset">
            <legend>航空類型</legend>
            <div class="segmented-filter">
              <label><input type="radio" name="airlineType" value="all" checked /><span>全部</span></label>
              <label><input type="radio" name="airlineType" value="low_cost" /><span>廉價航空</span></label>
              <label><input type="radio" name="airlineType" value="full_service" /><span>傳統航空</span></label>
            </div>
          </fieldset>
          <details class="advanced-filters">
            <summary>機型與航空公司</summary>
            <fieldset>
              <legend>不搭的機型</legend>
              <div class="check-grid" id="aircraftChoices"></div>
              <label><span>其他排除機型（逗號分隔）</span><input name="otherExcludedAircraft" placeholder="A220, E190" autocomplete="off" /></label>
              <label class="check-option"><input name="allowUnknownAircraft" type="checkbox" /><span>仍接受未提供機型的航班</span></label>
            </fieldset>
            <fieldset>
              <legend>不搭的航空公司</legend>
              <div class="check-grid" id="airlineChoices"></div>
              <label><span>其他航空公司代碼（逗號分隔）</span><input name="otherExcludedAirlines" placeholder="UA, BA, LH" autocomplete="off" /></label>
            </fieldset>
          </details>
          <fieldset class="filter-fieldset">
            <legend>行程方式</legend>
            <div class="segmented-filter">
              <label><input type="radio" name="routeType" value="any" checked /><span>全部</span></label>
              <label><input type="radio" name="routeType" value="nonstop" /><span>直達</span></label>
              <label><input type="radio" name="routeType" value="connecting" /><span>轉乘</span></label>
            </div>
          </fieldset>
              <div class="field-row">
                <label><span>幣別</span><select name="currency"><option value="TWD">TWD</option><option value="USD">USD</option><option value="JPY">JPY</option></select></label>
                <label><span>市場</span><select name="market"><option value="TW">台灣</option><option value="JP">日本</option><option value="US">美國</option></select></label>
              </div>
            </div>
          </details>
          <button class="primary-button" id="flightSubmitButton" type="submit">探索未來一年低價</button>
          <button class="ghost-button" id="copyTripLinkButton" type="button">複製行程連結</button>
          <div class="search-feedback" id="flightSearchFeedback" aria-live="polite" hidden>
            <div class="progress-track" id="flightProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="flightProgressBar"></span>
            </div>
            <p id="flightProgressText"></p>
          </div>
        </form>
      </section>

      <section class="panel" id="savedPanel" role="tabpanel">
        <div class="saved-toolbar">
          <h2>追蹤清單</h2>
          <button class="ghost-button" id="refreshSavedButton" type="button">更新</button>
        </div>
        <div class="saved-list" id="savedList"></div>
      </section>

      <section class="results-zone">
        <div class="results-head">
          <h2 id="resultsTitle">搜尋結果</h2>
          <span id="resultCount"></span>
        </div>
        <section id="fareComparison" class="fare-comparison" aria-live="polite" hidden></section>
        <section id="ticketQuoteStatus" class="ticket-quote-status" aria-live="polite" hidden></section>
        <section id="noResultGuidance" class="no-result-guidance" aria-live="polite" hidden></section>
        <div class="flight-year-stats" id="flightYearStats" hidden>
          <div class="year-stat">
            <span id="currentYearLabel">該年抽樣均價</span>
            <strong id="currentYearAverage">尚無資料</strong>
            <small id="currentYearMeta"></small>
          </div>
          <div class="year-stat">
            <span id="previousYearLabel">去年累積觀測均價</span>
            <strong id="previousYearAverage">尚無資料</strong>
            <small id="previousYearMeta"></small>
          </div>
        </div>
        <section class="duration-overview" id="durationOverview" aria-label="其他旅行天數低價" hidden>
          <div class="duration-overview-head">
            <h3>其他天數更便宜</h3>
            <span id="durationSummary"></span>
          </div>
          <div class="duration-list" id="durationList"></div>
        </section>
        <section class="cabin-overview" id="cabinOverview" aria-label="艙等最低價比較" hidden>
          <div class="cabin-overview-head">
            <h3>艙等價格一覽</h3>
            <span>同日期最低報價・航班可能不同</span>
          </div>
          <div class="cabin-price-grid" id="cabinPriceGrid"></div>
        </section>
        <div class="result-list" id="resultList"></div>
      </section>
    </main>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog">
        <header>
          <h2>同步設定</h2>
          <button class="icon-button" value="cancel" aria-label="關閉" type="submit">×</button>
        </header>
        <label>
          <span>同步金鑰</span>
          <input id="accessTokenInput" type="password" autocomplete="off" placeholder="PRICE_WATCH_ACCESS_TOKEN" />
        </label>
        <label>
          <span>API 位址</span>
          <input id="apiBaseInput" type="url" autocomplete="off" placeholder="https://your-worker.example.com" />
        </label>
        <button class="primary-button" id="saveSettingsButton" value="default" type="submit">儲存</button>
      </form>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">
        <strong>沒有資料</strong>
        <span>換個條件再試一次。</span>
      </div>
    </template>

    <script src="./vendor/flatpickr/flatpickr.min.js?v=4.6.13"></script>
    <script src="./vendor/flatpickr/zh-tw.js?v=4.6.13"></script>
    <script src="./app.js?v=32" type="module"></script>
  </body>
</html>
