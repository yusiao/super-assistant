name: A7 LINE Digest

on:
  schedule:
    # Taiwan time: Saturday 20:00
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force rerun and send LINE even if today's digest already ran"
        required: false
        type: boolean
        default: false
      publish_only:
        description: "Verify the weekly website and PDF without sending LINE"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: [self-hosted, windows, a7-runner]
    outputs:
      notification_due: ${{ steps.notification.outputs.due }}
    env:
      TASK_ID: a7-leju-digest-cloud
      PYTHONIOENCODING: utf-8
      TIME_ZONE: Asia/Taipei
      REPORT_ROOT: vault/2-actions/scheduled-reports/a7-leju
      STATE_PATH: vault/2-actions/scheduled-reports/a7-leju/state.json
      SYNC_LEDGER_PATH: system/skills/local-scheduler/config/sync-ledger.json
      AREA_CONFIG_PATH: scripts/a7-line-monitor/area-config.json
      BARGAIN_WATCH_CONFIG_PATH: scripts/a7-line-monitor/bargain-watch-config.json
      MARKET_PULSE_CONFIG_PATH: scripts/a7-line-monitor/market-pulse-config.json
      LINE_SCHEDULE: weekly
      WEEKLY_REPORT_DAY: "6"
      WEEKLY_REPORT_HOUR: "20"
      WEEKLY_CATCH_UP_HOURS: "144"
      INTRADAY_ALERTS: "false"
      URGENT_PENDING_PRESALE_ALERT: "false"
      PDF_DELIVERY_ENABLED: "true"
      REPORT_PDF_PUBLIC_URL: https://yusiao.github.io/super-assistant/a7-reports/a7-market-report-latest.pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore digest state
        uses: actions/cache@v4
        with:
          path: |
            vault/2-actions/scheduled-reports/a7-leju/state.json
            system/skills/local-scheduler/config/sync-ledger.json
          key: a7-leju-state-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            a7-leju-state-

      - name: Restore source cooldowns separately from delivery state
        uses: actions/cache@v4
        with:
          path: vault/2-actions/scheduled-reports/a7-leju/fetch-policy.json
          key: a7-fetch-policy-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            a7-fetch-policy-

      - name: Prepare fast Python dependencies
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python --version
          python -m pip install --disable-pip-version-check --quiet -r scripts/a7-line-monitor/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed." }
          python -m playwright install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }

      - name: Run A7 digest
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python -m unittest discover -s scripts/a7-line-monitor -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Notification regression tests failed." }
          if ("${{ inputs.publish_only }}" -eq "true") {
            python scripts/a7-line-monitor/a7_leju_digest.py --force-generate --weekly-preview --dry-run --skip-line
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.force_send }}" -eq "true") {
            python scripts/a7-line-monitor/a7_leju_digest.py --force --skip-line
          } else {
            python scripts/a7-line-monitor/a7_leju_digest.py --force-generate --skip-line
          }
          if ($LASTEXITCODE -ne 0) { throw "Digest generation failed; previous public data will not be replaced." }

      - name: Stage verified website, market data and matching PDF
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python scripts/a7-line-monitor/publish_site.py --weekly "$env:REPORT_ROOT" "$env:RUNNER_TEMP/a7-pages-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw "Public website export failed." }

      - name: Check prepared LINE notification
        id: notification
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $manifest = "vault/2-actions/scheduled-reports/a7-leju/a7-line-prepared.json"
          if (Test-Path -LiteralPath $manifest) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "due=true`n")
          } else {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "due=false`n")
          }

      - name: Upload GitHub Pages source
        uses: actions/upload-artifact@v4
        with:
          name: a7-pages-site
          path: ${{ runner.temp }}/a7-pages-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      - name: Upload prepared LINE notification
        if: ${{ steps.notification.outputs.due == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: a7-line-prepared
          path: vault/2-actions/scheduled-reports/a7-leju/a7-line-prepared.json
          if-no-files-found: error

      - name: Upload report artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a7-leju-digest
          path: vault/2-actions/scheduled-reports/a7-leju/

  deploy-pages:
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download GitHub Pages source
        uses: actions/download-artifact@v4
        with:
          name: a7-pages-site
          path: site/a7-reports

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  send-line:
    needs: [build-report, deploy-pages]
    if: ${{ needs.build-report.outputs.notification_due == 'true' && !inputs.publish_only }}
    # Same OS as build-report so its delivery ledger can be restored reliably.
    runs-on: [self-hosted, windows, a7-runner]
    env:
      TASK_ID: a7-leju-digest-cloud
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_MODE: ${{ secrets.LINE_MODE }}
      LINE_TO: ${{ secrets.LINE_TO }}
      SYNC_LEDGER_PATH: system/skills/local-scheduler/config/sync-ledger.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download prepared LINE notification
        uses: actions/download-artifact@v4
        with:
          name: a7-line-prepared
          path: vault/2-actions/scheduled-reports/a7-leju

      - name: Restore and persist delivery checkpoints
        uses: actions/cache@v4
        with:
          path: |
            vault/2-actions/scheduled-reports/a7-leju/state.json
            system/skills/local-scheduler/config/sync-ledger.json
          key: a7-leju-state-${{ github.run_id }}-${{ github.run_attempt }}-sent
          restore-keys: |
            a7-leju-state-${{ github.run_id }}-${{ github.run_attempt }}-build
            a7-leju-state-

      - name: Send prepared PDF notification
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python scripts/a7-line-monitor/a7_leju_digest.py --send-prepared-line vault/2-actions/scheduled-reports/a7-leju/a7-line-prepared.json
          if ($LASTEXITCODE -ne 0) { throw "LINE delivery failed; checkpoints were not saved." }
