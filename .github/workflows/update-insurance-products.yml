name: Weekly insurance product update and usage check

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install pdfplumber

      - name: Discover public insurance products
        env:
          INSURANCE_DISCOVERY_MAX_PAGES: 18
          INSURANCE_DISCOVERY_TIMEOUT_MS: 7000
        run: node scripts/discover-insurance-products.mjs

      - name: Build complete Finfo product-code index
        env:
          FINFO_INDEX_TIMEOUT_MS: 30000
        run: node scripts/discover-finfo-catalog.mjs

      - name: Discover Finfo product codes
        env:
          PYTHON: python
          FINFO_DETAIL_LIMIT: 120
        run: node scripts/discover-finfo-products.mjs

      - name: Update products from configured feed
        env:
          INSURANCE_PRODUCT_FEED_URL: ${{ secrets.INSURANCE_PRODUCT_FEED_URL }}
        run: node scripts/update-insurance-products.mjs

      - name: Validate product coverage and premium tables
        run: node scripts/validate-insurance-products.mjs

      - name: Run insurance planner regression checks
        run: node scripts/test-insurance-planner-v45.mjs && node scripts/test-insurance-catalog-alerts.mjs

      - name: Check product changes and popularity spikes
        id: catalog-monitor
        run: node scripts/check-insurance-catalog-alerts.mjs

      - name: Notify product changes in a GitHub issue
        if: steps.catalog-monitor.outputs.has_alerts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('data/insurance/catalog-monitor-summary.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const title = `保管商品資料警示 ${date}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (!existing.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Simulate 10,000 policy-management users (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/test-insurance-planner-10000.mjs

      - name: Commit updated products
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update insurance product database"
          file_pattern: output/insurance-planner/products.json output/insurance-planner-cloudflare/products.json output/insurance-planner/synthetic-usage-report.json data/insurance/products-feed.json data/insurance/products-discovered.json data/insurance/discovery-report.json data/insurance/products-finfo-index.json data/insurance/finfo-index-report.json data/insurance/products-finfo-feed.json data/insurance/finfo-discovery-report.json data/insurance/finfo-enrichment-state.json data/insurance/catalog-monitor-state.json data/insurance/catalog-monitor-report.json data/insurance/catalog-monitor-summary.md

      - name: Deploy updated catalog to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy output/insurance-planner-cloudflare --project-name jarvis-insurance-planner --branch main --commit-dirty=true
