name: Publish Property Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/a7-line-monitor/site/**
      - scripts/a7-line-monitor/public_site.py
      - scripts/a7-line-monitor/publish_site.py
      - .github/workflows/a7-observatory.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public data boundary
        run: python -m unittest discover -s scripts/a7-line-monitor -p 'test_public_site.py'
      - name: Build public website without sending LINE
        run: python scripts/a7-line-monitor/publish_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
